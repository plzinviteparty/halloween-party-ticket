<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>핼러윈 파티 입장권</title><meta name="description" content="이름과 사진을 넣어 핼러윈 파티 입장권을 만들고 이미지로 저장하세요."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%231c1230'/%3E%3Cpath d='M10 19h44v10a7 7 0 0 0 0 14v5H10v-5a7 7 0 0 0 0-14z' fill='%23ff9d42'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#100b1c;color:#f8f2ec;font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:1230px;margin:auto;padding:36px 24px 70px}header{margin-bottom:28px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.04em;margin:0}header p{color:#c9bfd3;margin:0}.workspace{display:grid;grid-template-columns:minmax(285px,340px) minmax(0,1fr);gap:28px;align-items:start}.panel{background:#211832;border:1px solid #453651;border-radius:20px;padding:26px;box-shadow:0 18px 50px #09061255}.panel h2{margin:0 0 24px;font-size:21px}.field{display:block;margin:0 0 22px;font-weight:700}.field small{display:block;color:#bfb2c9;font-weight:400;margin:5px 0 10px}.field input[type=text]{width:100%;border:1px solid #786484;background:#120e1e;color:white;border-radius:10px;padding:12px 13px;outline-offset:3px}.field input[type=file]{max-width:100%;font-size:14px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:14px}.colors .field{font-size:14px}.colors input{width:100%;height:45px;border:1px solid #786484;border-radius:9px;background:#120e1e;padding:3px}.save{width:100%;border:0;background:#ffab60;color:#24152d;font-weight:800;border-radius:11px;padding:15px;margin-top:5px}.save:hover{background:#ffc086}.hint{font-size:13px;color:#bfb2c9;margin:14px 0 0}.preview{min-width:0}.preview h2{font-size:17px;color:#d3c7dc;margin:0 0 15px}.ticketWrap{overflow:auto;padding:20px;background:radial-gradient(circle at 70% 10%,#382345,#171021 65%);border-radius:20px;border:1px solid #453651}.ticket{--paper:#321a45;--ink:#fff5e8;--accent:#ffae62;position:relative;display:grid;grid-template-columns:1fr 163px;width:min(100%,740px);min-width:600px;min-height:355px;margin:auto;color:var(--ink);background:var(--paper);border:2px solid var(--accent);border-radius:16px;overflow:hidden;box-shadow:0 20px 45px #0005}.ticket:before{content:'';position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--accent),transparent 40%);border-radius:8px;pointer-events:none}.ticket:after{content:'';position:absolute;width:280px;height:280px;border:1px solid color-mix(in srgb,var(--accent),transparent 65%);border-radius:50%;right:155px;top:-185px;pointer-events:none}.body{padding:28px 27px 27px 32px;position:relative}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.24em;color:var(--accent)}.ticket h3{font-family:Georgia,serif;font-size:clamp(30px,4vw,43px);line-height:1.02;letter-spacing:.035em;margin:10px 0 5px;color:var(--ink)}.sub{font-size:12px;letter-spacing:.24em;color:var(--accent);font-weight:700}.line{height:1px;background:var(--accent);opacity:.6;margin:22px 0 16px}.identity{display:flex;gap:20px;align-items:flex-end}.photo{width:111px;height:132px;border:1px solid var(--accent);background:color-mix(in srgb,var(--paper),white 7%);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.photo img{width:100%;height:100%;object-fit:cover}.photo span{font-size:12px;color:var(--ink);opacity:.62;text-align:center;letter-spacing:.12em}.namearea{min-width:0;flex:1;border-bottom:1px solid var(--accent);padding-bottom:7px}.namearea label{display:block;font-size:11px;letter-spacing:.24em;color:var(--accent);font-weight:800}.namearea strong{display:block;font:27px/1.4 Georgia,'Noto Sans KR',serif;overflow-wrap:anywhere;min-height:38px}.stub{border-left:2px dashed var(--accent);padding:25px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.stub .vertical{writing-mode:vertical-rl;font:700 15px Georgia,serif;letter-spacing:.22em}.stub .seal{width:80px;height:80px;border:1px solid var(--accent);border-radius:50%;display:grid;place-content:center;color:var(--accent);font:700 12px/1.5 Georgia,serif;letter-spacing:.1em;transform:rotate(-13deg)}.stub .serial{font-size:11px;letter-spacing:.16em;color:var(--accent)}@media(max-width:800px){main{padding:24px 16px 45px}.workspace{grid-template-columns:1fr}.panel{padding:22px}.ticketWrap{padding:13px}}@media(max-width:450px){header{gap:4px}.ticketWrap{overflow:hidden}.ticket{transform:scale(.5);transform-origin:top left;margin-bottom:-178px}.preview{overflow:hidden}}
</style></head><body><main><header><h1>핼러윈 파티 입장권</h1><p>이름과 사진을 넣고 나만의 티켓을 만들어 주세요.</p></header><div class="workspace"><section class="panel" aria-label="입장권 편집"><h2>티켓 꾸미기</h2><label class="field">Name<small>입장권에 표시할 이름을 입력해 주세요.</small><input id="name" type="text" maxlength="40" placeholder="이름을 입력해 주세요" autocomplete="name"></label><label class="field">프로필 사진<small>사진은 서버에 업로드되지 않습니다.</small><input id="photoInput" type="file" accept="image/*"></label><div class="colors"><label class="field">티켓 색상<input id="paper" type="color" value="#321a45"></label><label class="field">글씨 색상<input id="ink" type="color" value="#fff5e8"></label><label class="field">포인트 색상<input id="accent" type="color" value="#ffae62"></label></div><button class="save" id="save" type="button">이미지로 저장하기</button><p class="hint">PNG 이미지로 저장됩니다. 사진과 이름은 이 기기에서만 처리됩니다.</p></section><section class="preview"><h2>미리보기</h2><div class="ticketWrap"><div class="ticket" id="ticket"><div class="body"><div class="eyebrow">YOU ARE INVITED</div><h3>HALLOWEEN<br>PARTY</h3><div class="sub">ADMISSION TICKET · 입장권</div><div class="line"></div><div class="identity"><div class="photo" id="photoBox"><span>YOUR<br>PHOTO</span></div><div class="namearea"><label>NAME</label><strong id="displayName">　　　　　　　　　</strong></div></div></div><div class="stub"><div class="vertical">HALLOWEEN PARTY</div><div class="seal">ADMIT<br>ONE</div><div class="serial">★ 001 ★</div></div></div></div></section></div></main><script>
const $=id=>document.getElementById(id), nameInput=$('name'),photoBox=$('photoBox');let photo=null,photoURL=null;
nameInput.addEventListener('input',()=>{$('displayName').textContent=nameInput.value.trim()||'　　　　　　　　　'});
for(const id of ['paper','ink','accent'])$(id).addEventListener('input',e=>$('ticket').style.setProperty('--'+id,e.target.value));
$('photoInput').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');return}if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(file);const img=new Image();img.onload=()=>{photo=img;photoBox.replaceChildren(img)};img.onerror=()=>alert('사진을 불러오지 못했습니다. 다른 파일을 선택해 주세요.');img.src=photoURL});
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function fit(ctx,s,max){let size=max;while(size>22){ctx.font=`bold ${size}px Georgia, 'Noto Sans KR', sans-serif`;if(ctx.measureText(s).width<=395)break;size-=2}return size}
$('save').addEventListener('click',()=>{const canvas=document.createElement('canvas');canvas.width=1480;canvas.height=710;const c=canvas.getContext('2d');const paper=$('paper').value,ink=$('ink').value,accent=$('accent').value;c.fillStyle=paper;rounded(c,2,2,1476,706,30);c.fill();c.strokeStyle=accent;c.lineWidth=4;c.stroke();c.globalAlpha=.65;rounded(c,20,20,1440,670,17);c.lineWidth=2;c.stroke();c.globalAlpha=1;c.font='bold 24px Arial';c.letterSpacing='5px';c.fillStyle=accent;c.fillText('YOU ARE INVITED',64,94);c.fillStyle=ink;c.font='bold 83px Georgia';c.letterSpacing='2px';c.fillText('HALLOWEEN',60,205);c.fillText('PARTY',60,297);c.fillStyle=accent;c.font='bold 23px Arial';c.letterSpacing='4px';c.fillText('ADMISSION TICKET · 입장권',64,345);c.letterSpacing='0px';c.globalAlpha=.7;c.fillRect(64,386,1050,2);c.globalAlpha=1;c.strokeStyle=accent;c.lineWidth=2;c.strokeRect(64,420,222,264);if(photo){const ratio=Math.max(222/photo.naturalWidth,264/photo.naturalHeight),w=photo.naturalWidth*ratio,h=photo.naturalHeight*ratio;c.save();c.beginPath();c.rect(65,421,220,262);c.clip();c.drawImage(photo,64+(222-w)/2,420+(264-h)/2,w,h);c.restore()}else{c.fillStyle=ink;c.globalAlpha=.65;c.font='24px Arial';c.textAlign='center';c.fillText('YOUR PHOTO',175,560);c.textAlign='left';c.globalAlpha=1}c.fillStyle=accent;c.font='bold 23px Arial';c.letterSpacing='5px';c.fillText('NAME',330,550);c.fillStyle=ink;c.letterSpacing='0px';let n=nameInput.value.trim();if(n){const size=fit(c,n,54);c.font=`bold ${size}px Georgia, 'Noto Sans KR', sans-serif`;c.fillText(n,330,615,780)}c.fillStyle=accent;c.fillRect(330,653,780,2);c.setLineDash([12,10]);c.beginPath();c.moveTo(1150,20);c.lineTo(1150,690);c.stroke();c.setLineDash([]);c.fillStyle=ink;c.save();c.translate(1210,52);c.rotate(Math.PI/2);c.font='bold 28px Georgia';c.letterSpacing='7px';c.fillText('HALLOWEEN PARTY',0,0);c.restore();c.strokeStyle=accent;c.beginPath();c.arc(1315,507,75,0,Math.PI*2);c.stroke();c.fillStyle=accent;c.textAlign='center';c.font='bold 25px Georgia';c.letterSpacing='1px';c.fillText('ADMIT',1315,503);c.fillText('ONE',1315,535);c.font='22px Arial';c.fillText('★ 001 ★',1315,654);c.textAlign='left';canvas.toBlob(blob=>{if(!blob){alert('이미지를 저장하지 못했습니다.');return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='halloween-party-ticket.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},'image/png')});
</script></body></html>
