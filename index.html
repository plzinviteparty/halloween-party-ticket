<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>핼러윈 파티 입장권</title>
  <meta name="description" content="배경과 입장권을 꾸미고 한 장의 이미지로 저장하세요.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%231c1230'/%3E%3Cpath d='M10 19h44v10a7 7 0 0 0 0 14v5H10v-5a7 7 0 0 0 0-14z' fill='%23ff9d42'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+TC:wght@700&display=swap">
  <style>
*{box-sizing:border-box} :root{--paper:#eee5d2;--ink:#352b31;--red:#873a4d;--muted:#756773;--line:#b9aa99}body{margin:0;background:#211e29;color:var(--paper);font:14px/1.6 'Noto Sans KR',system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:1500px;margin:auto;padding:0 36px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:25px 0 22px;border-bottom:1px solid #756773}header .masthead{display:flex;align-items:center;gap:16px}.house-seal{width:48px;height:58px;border:1px solid #b8a68c;display:grid;place-items:center;color:#d9c09b;font:32px Georgia,serif;clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%)}.eyebrow{font:10px Georgia,serif;letter-spacing:3px;color:#b9a898;margin-bottom:4px}h1{font:normal 26px 'Noto Sans KR',serif;letter-spacing:-1px;margin:0}header p{margin:0;text-align:right;font-size:12px;color:#bcafbb}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:34px;padding-top:25px;align-items:start}.editor{grid-column:2;grid-row:1;background:var(--paper);color:var(--ink);padding:0 23px 22px;border-top:5px solid #a34e61;box-shadow:7px 7px 0 #15141b}.ledger-heading{padding:18px 0 14px;border-bottom:3px double var(--ink);display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif;font-size:20px}.ledger-heading small{font:10px system-ui;letter-spacing:2px;color:var(--red)}.panel{border:0;border-bottom:1px solid var(--line);padding:0;margin:0}.panel summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:17px 0;font-weight:700;font-size:14px}.panel summary::-webkit-details-marker{display:none}.panel summary:after{content:'＋';margin-left:auto;color:var(--red);font-size:18px;font-weight:400}.panel[open] summary:after{content:'−'}.number{color:var(--red);font:italic 16px Georgia,serif;width:21px}.panel-body{padding:0 0 8px}.field{display:block;margin:0 0 17px;font-size:12px;font-weight:700}.field small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.6;margin:4px 0 8px}.field input[type=text],select{width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;outline-offset:4px}.field input[type=text]{font-size:18px}.field input[type=file]{width:100%;font-size:11px;font-weight:400;color:var(--muted)}input::file-selector-button{border:1px solid #a49689;background:transparent;color:var(--ink);padding:6px 9px;margin-right:8px;cursor:pointer}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field input[type=color]{display:block;width:100%;height:34px;padding:3px;border:1px solid #b0a193;background:transparent;border-radius:0;margin-top:6px;cursor:pointer}.slider{width:100%;accent-color:var(--red);cursor:pointer;height:18px}.slider-row{display:flex;justify-content:space-between;font-size:10px;font-weight:400;color:var(--muted)}output{float:right;font-weight:400;color:var(--red)}.ratio-options{display:flex;border-bottom:1px solid var(--line);margin-top:9px;gap:8px}.ratio-options label{flex:1}.ratio-options input{position:absolute;opacity:0;width:1px;height:1px}.ratio-options span{display:block;text-align:center;padding:8px 2px;border-bottom:3px solid transparent;cursor:pointer;font-size:11px;font-weight:400}.ratio-options input:checked+span{border-color:var(--red);color:var(--red);font-weight:700}.ratio-options input:focus-visible+span{outline:2px solid var(--red)}.preview{grid-column:1;grid-row:1;position:sticky;top:20px;min-width:0}.worktop-label{display:flex;justify-content:space-between;gap:10px;color:#c2b2bd;font:11px Georgia,serif;letter-spacing:2px;padding-bottom:14px}.worktop-label h2{font:inherit;margin:0}.worktop-label span{color:#9b8a96;font:11px system-ui;letter-spacing:0}.canvas-shell{min-height:470px;padding:30px 28px;display:flex;align-items:center;justify-content:center;position:relative;background:#302b36;border:1px solid #61535f}.canvas-shell:before,.canvas-shell:after{content:'';position:absolute;width:16px;height:16px;pointer-events:none;border-color:#b49a85;border-style:solid}.canvas-shell:before{top:9px;left:9px;border-width:1px 0 0 1px}.canvas-shell:after{bottom:9px;right:9px;border-width:0 1px 1px 0}canvas{display:block;width:auto;height:auto;max-width:100%;max-height:64vh;object-fit:contain;box-shadow:0 4px 12px #0004}.save-block{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid #756773}.save{flex-shrink:0;border:1px solid #d1b48d;background:#d1b48d;color:#29212b;border-radius:0;padding:12px 25px;font-weight:700;font-size:13px;box-shadow:3px 3px 0 #100f15}.save:hover{background:#e5cfaa}.hint{margin:0;color:#bcafbb;font-size:11px;max-width:300px}.ledger-note{font-size:10px;color:var(--muted);padding-top:15px;margin:0}.footer-note{display:flex;justify-content:space-between;font:10px Georgia,serif;letter-spacing:2px;color:#998a96;padding-top:26px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #bf647d;outline-offset:4px}.photo-options[hidden],[hidden]{display:none!important}.panel button{border:1px solid #a49689!important;background:transparent!important;color:var(--red)!important;border-radius:0!important;font-size:11px!important;padding:6px 9px!important} @media(min-width:1400px){.workspace{grid-template-columns:minmax(0,1fr) 370px;gap:44px}.canvas-shell{min-height:560px}}@media(max-width:900px){main{padding:0 20px 25px}.workspace{grid-template-columns:minmax(0,1fr) 300px;gap:20px}.editor{padding-left:17px;padding-right:17px}.canvas-shell{padding:20px 12px;min-height:390px}.save-block{display:block}.save{width:100%}.hint{max-width:none;margin-top:13px}}@media(max-width:700px){main{padding:0 14px 24px}header{padding:18px 0;gap:12px}.house-seal{width:35px;height:45px;font-size:25px}.masthead{gap:10px!important}h1{font-size:19px}.eyebrow{font-size:8px;letter-spacing:2px}header p{display:none}.workspace{display:flex;flex-direction:column;gap:22px;padding-top:18px}.preview{position:static;width:100%}.canvas-shell{min-height:280px;padding:22px 12px}canvas{max-height:52vh}.worktop-label{font-size:10px;padding-bottom:10px;letter-spacing:1px}.save-block{display:flex;gap:12px;padding:15px 0}.save{width:auto;padding:11px 15px;font-size:12px}.hint{font-size:10px;margin:0;max-width:190px}.editor{width:100%;padding:0 20px 20px;box-shadow:4px 4px #15141b}.footer-note{font-size:8px;letter-spacing:1px}.panel summary{padding:15px 0}}@media(prefers-reduced-motion:no-preference){.save{transition:background .15s}}
</style>
</head>
<body><main>
  <header><div class="masthead"><div class="house-seal" aria-hidden="true">H</div><div><div class="eyebrow">THE MANSION · HALLOWEEN PARTY</div><h1>대저택 입장권 발급처</h1></div></div><p>이름을 적고 사진을 골라 주세요.<br>파티에 가져갈 입장권을 준비합니다.</p></header>
  <div class="workspace">
    <div class="editor"><div class="ledger-heading">Guest register <small>입장권 꾸미기</small></div>
      <details class="panel" open><summary><span class="number">01</span> 이름과 티켓</summary><div class="panel-body">
        
        <label class="field">Name<small>티켓에 표시할 이름을 입력해 주세요.</small><input id="name" type="text" maxlength="40" placeholder="이름을 입력해 주세요" autocomplete="name"></label>
        <label class="field">프로필 사진<small>티켓의 사진 칸에 표시됩니다.</small><input id="ticketPhoto" type="file" accept="image/*"></label>
        <label class="field">티켓 배경 사진<small>티켓 안쪽을 채울 사진을 선택해 주세요.</small><input id="ticketBackgroundPhoto" type="file" accept="image/*"></label>
        <div id="ticketBackgroundOptions" hidden>
          <button id="removeTicketBackground" type="button" style="border:1px solid #786484;background:#130f20;color:#f8f2ec;border-radius:9px;padding:8px 12px;margin-bottom:15px">티켓 배경 사진 제거</button>
          <label class="field">티켓 사진 확대<input class="slider" id="ticketBackgroundZoom" type="range" min="100" max="250" value="100"></label>
          <label class="field">티켓 사진 가로 위치<input class="slider" id="ticketBackgroundX" type="range" min="0" max="100" value="50"></label>
          <label class="field">티켓 사진 세로 위치<input class="slider" id="ticketBackgroundY" type="range" min="0" max="100" value="50"></label>
        </div>
        <label class="field">티켓 배경 투명도 <output id="opacityValue">100%</output><small>배경색과 배경 사진만 투명해집니다. 사진·글씨·포인트는 그대로 표시됩니다.</small><input class="slider" id="ticketOpacity" type="range" min="0" max="100" value="100"></label>
        <div class="colors">
          <label class="field">티켓 색상<input id="paper" type="color" value="#321a45"></label>
          <label class="field">글씨 색상<input id="ink" type="color" value="#fff5e8"></label>
          <label class="field">포인트 색상<input id="accent" type="color" value="#ffae62"></label>
        </div>
        <label class="field">티켓 크기 <output id="sizeValue">100%</output><input class="slider" id="ticketSize" type="range" min="60" max="110" value="100"></label>
        <label class="field">티켓 높이<input class="slider" id="ticketY" type="range" min="15" max="85" value="50"><span class="slider-row"><span>위</span><span>아래</span></span></label>
      </div></details>
<details class="panel"><summary><span class="number">02</span> 배경과 비율</summary><div class="panel-body">
        
        <div class="field"><span>배경 비율</span><div class="ratio-options" role="radiogroup" aria-label="배경 비율">
          <label><input type="radio" name="ratio" value="1:1" checked><span>1:1 정사각형</span></label>
          <label><input type="radio" name="ratio" value="2:3"><span>2:3 세로</span></label>
          <label><input type="radio" name="ratio" value="4:3"><span>4:3 가로</span></label>
        </div></div>
        <label class="field">배경 색상<small>사진을 넣지 않으면 이 색상이 배경이 됩니다.</small><input id="backgroundColor" type="color" value="#221633"></label>
        <label class="field">배경 사진<small>기기에서 사진을 선택하세요. 선택한 사진은 이 기기에서만 처리됩니다.</small><input id="backgroundPhoto" type="file" accept="image/*"></label>
        <div id="photoOptions" class="photo-options" hidden>
          <button id="removeBackground" type="button" style="border:1px solid #786484;background:#130f20;color:#f8f2ec;border-radius:9px;padding:8px 12px;margin:0 0 15px">배경 사진 제거</button>
          <label class="field">사진 확대 <output id="zoomValue">100%</output><input class="slider" id="backgroundZoom" type="range" min="100" max="250" value="100"></label>
          <label class="field">사진 가로 위치<input class="slider" id="backgroundX" type="range" min="0" max="100" value="50"><span class="slider-row"><span>왼쪽</span><span>오른쪽</span></span></label>
          <label class="field">사진 세로 위치<input class="slider" id="backgroundY" type="range" min="0" max="100" value="50"><span class="slider-row"><span>위</span><span>아래</span></span></label>
        </div>
      </div></details>
      <p class="ledger-note">꾸민 내용은 미리보기에 바로 표시됩니다.</p>
    </div>
<section class="preview" aria-labelledby="preview-title"><div class="worktop-label"><h2 id="preview-title">YOUR INVITATION</h2><span>입장권 미리보기</span></div><div class="canvas-shell"><canvas id="previewCanvas" width="1200" height="1200" role="img" aria-label="꾸미고 있는 핼러윈 파티 입장권 미리보기"></canvas></div>      <div class="save-block"><button class="save" id="save" type="button">입장권 이미지 저장 ↓</button><p class="hint">사진과 이름은 서버에 업로드되지 않습니다.<br>완성한 입장권은 PNG 이미지로 저장됩니다.</p></div></section>
  </div>
<div class="footer-note"><span>ADMIT ONE · 귀빈 한 분을 초대합니다</span><span>THE MANSION / TICKET OFFICE</span></div></main>
<script>
const $=id=>document.getElementById(id);
const canvas=$('previewCanvas'),ctx=canvas.getContext('2d');
let backgroundImage=null,ticketImage=null,ticketBackgroundImage=null;
function loadImage(input,done){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');input.value='';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{done(img);URL.revokeObjectURL(url);draw()};img.onerror=()=>{URL.revokeObjectURL(url);alert('사진을 불러오지 못했습니다. 다른 파일을 선택해 주세요.')};img.src=url}
$('backgroundPhoto').addEventListener('change',e=>loadImage(e.target,img=>{backgroundImage=img;$('photoOptions').hidden=false}));
$('ticketPhoto').addEventListener('change',e=>loadImage(e.target,img=>{ticketImage=img}));
$('ticketBackgroundPhoto').addEventListener('change',e=>loadImage(e.target,img=>{ticketBackgroundImage=img;$('ticketBackgroundOptions').hidden=false}));
$('removeTicketBackground').addEventListener('click',()=>{ticketBackgroundImage=null;$('ticketBackgroundPhoto').value='';$('ticketBackgroundOptions').hidden=true;draw()});
$('removeBackground').addEventListener('click',()=>{backgroundImage=null;$('backgroundPhoto').value='';$('photoOptions').hidden=true;draw()});
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',draw));
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function cover(c,img,x,y,w,h,zoom=1,px=.5,py=.5){const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight)*zoom;const sw=img.naturalWidth*scale,sh=img.naturalHeight*scale;c.drawImage(img,x-(sw-w)*px,y-(sh-h)*py,sw,sh)}
function drawTicket(){const t=document.createElement('canvas');t.width=1480;t.height=710;const c=t.getContext('2d'),paper=$('paper').value,ink=$('ink').value,accent=$('accent').value;
 const background=document.createElement('canvas');background.width=1480;background.height=710;const bc=background.getContext('2d');bc.fillStyle=paper;rounded(bc,3,3,1474,704,30);bc.fill();if(ticketBackgroundImage){bc.save();rounded(bc,3,3,1474,704,30);bc.clip();cover(bc,ticketBackgroundImage,3,3,1474,704,Number($('ticketBackgroundZoom').value)/100,Number($('ticketBackgroundX').value)/100,Number($('ticketBackgroundY').value)/100);bc.restore()}c.globalAlpha=Number($('ticketOpacity').value)/100;c.drawImage(background,0,0);c.globalAlpha=1;rounded(c,3,3,1474,704,30);c.strokeStyle=accent;c.lineWidth=4;c.stroke();c.globalAlpha=.65;rounded(c,20,20,1440,670,17);c.lineWidth=2;c.stroke();c.globalAlpha=1;
 c.fillStyle=accent;c.font='bold 24px Arial, sans-serif';c.letterSpacing='5px';c.fillText('YOU ARE INVITED',64,94);
 c.fillStyle=ink;c.font='bold 83px Georgia, serif';c.letterSpacing='2px';c.fillText('HALLOWEEN',60,205);c.fillText('PARTY',60,297);
 c.fillStyle=accent;c.font='bold 23px Arial, sans-serif';c.letterSpacing='4px';c.fillText('ADMISSION TICKET · 입장권',64,345);c.letterSpacing='0px';c.globalAlpha=.7;c.fillRect(64,386,1050,2);c.globalAlpha=1;
 c.strokeStyle=accent;c.lineWidth=2;c.strokeRect(64,420,222,264);
 if(ticketImage){c.save();c.beginPath();c.rect(65,421,220,262);c.clip();cover(c,ticketImage,65,421,220,262);c.restore()}else{c.fillStyle=ink;c.globalAlpha=.65;c.font='24px Arial, sans-serif';c.textAlign='center';c.fillText('YOUR PHOTO',175,560);c.textAlign='left';c.globalAlpha=1}
 c.fillStyle=accent;c.font='bold 23px Arial, sans-serif';c.letterSpacing='5px';c.fillText('NAME',330,550);c.fillStyle=ink;c.letterSpacing='0px';const name=$('name').value.trim();if(name){let size=54;do{c.font='bold '+size+'px Georgia, "Noto Sans KR", "Noto Sans JP", "Noto Sans TC", sans-serif';if(c.measureText(name).width<=780)break;size-=2}while(size>22);c.fillText(name,330,615,780)}c.fillStyle=accent;c.fillRect(330,653,780,2);
 c.setLineDash([12,10]);c.beginPath();c.moveTo(1150,20);c.lineTo(1150,690);c.stroke();c.setLineDash([]);c.fillStyle=ink;c.save();c.translate(1210,52);c.rotate(Math.PI/2);c.font='bold 28px Georgia, serif';c.letterSpacing='7px';c.fillText('HALLOWEEN PARTY',0,0);c.restore();c.strokeStyle=accent;c.beginPath();c.arc(1315,507,75,0,Math.PI*2);c.stroke();c.fillStyle=accent;c.textAlign='center';c.font='bold 25px Georgia, serif';c.letterSpacing='1px';c.fillText('ADMIT',1315,503);c.fillText('ONE',1315,535);c.font='22px Arial, sans-serif';c.fillText('★ 001 ★',1315,654);c.textAlign='left';return t}
function draw(){const ratio=document.querySelector('input[name="ratio"]:checked').value,heights={'1:1':1200,'2:3':1800,'4:3':900};const w=1200,h=heights[ratio];if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.fillStyle=$('backgroundColor').value;ctx.fillRect(0,0,w,h);
 if(backgroundImage){const zoom=Number($('backgroundZoom').value)/100,x=Number($('backgroundX').value)/100,y=Number($('backgroundY').value)/100;cover(ctx,backgroundImage,0,0,w,h,zoom,x,y)}
 const ticket=drawTicket(),size=Number($('ticketSize').value)/100,tw=1080*size,th=tw*710/1480,cy=h*(Number($('ticketY').value)/100),ty=Math.max(25,Math.min(h-th-25,cy-th/2));ctx.drawImage(ticket,(w-tw)/2,ty,tw,th);ctx.globalAlpha=1;ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 $('opacityValue').textContent=$('ticketOpacity').value+'%';$('zoomValue').textContent=$('backgroundZoom').value+'%';$('sizeValue').textContent=$('ticketSize').value+'%';canvas.setAttribute('aria-label','핼러윈 파티 입장권 미리보기, 배경 비율 '+ratio)}
function loadNameFonts(){const text=$('name').value.trim()||'초대 招待 Guest';return Promise.all(['Noto Sans KR','Noto Sans JP','Noto Sans TC'].map(font=>document.fonts.load('700 54px "'+font+'"',text))).catch(()=>{})}
$('name').addEventListener('input',()=>{loadNameFonts().then(draw)});
$('save').addEventListener('click',async()=>{await loadNameFonts();draw();canvas.toBlob(blob=>{if(!blob){alert('이미지를 저장하지 못했습니다.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='halloween-party-ticket.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png')});
loadNameFonts().then(draw);draw();
</script></body></html>
