<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>핼러윈 파티 입장권</title>
  <meta name="description" content="배경과 입장권을 꾸미고 한 장의 이미지로 저장하세요.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%231c1230'/%3E%3Cpath d='M10 19h44v10a7 7 0 0 0 0 14v5H10v-5a7 7 0 0 0 0-14z' fill='%23ff9d42'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+TC:wght@700&display=swap">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#100b1c;color:#f8f2ec;font:16px/1.5 system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:1240px;margin:auto;padding:28px 22px 60px}header{margin-bottom:22px}h1{font-size:clamp(26px,3vw,36px);letter-spacing:-.04em;margin:0}header p{color:#c9bfd3;margin:3px 0 0}.workspace{display:grid;grid-template-columns:minmax(290px,348px) minmax(0,1fr);gap:24px;align-items:start}.editor{display:grid;gap:16px}.panel{background:#211832;border:1px solid #453651;border-radius:18px;padding:22px;box-shadow:0 18px 50px #09061255}.panel h2{font-size:19px;margin:0 0 18px;display:flex;align-items:center;gap:10px}.number{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:#ffab60;color:#24152d;font-size:14px}.field{display:block;margin:0 0 17px;font-weight:700;font-size:14px}.field:last-child{margin-bottom:0}.field small{display:block;color:#c9bfd3;font-weight:400;margin:4px 0 8px;font-size:13px}.field input[type=text],select{width:100%;border:1px solid #786484;background:#120e1e;color:white;border-radius:10px;padding:11px 12px;outline-offset:3px}.field input[type=file]{max-width:100%;font-size:13px;color:#ddd2e5}.field input[type=color]{width:100%;height:43px;border:1px solid #786484;border-radius:9px;background:#120e1e;padding:3px;cursor:pointer}.colors{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.slider{width:100%;accent-color:#ffab60;cursor:pointer}.slider-row{display:flex;justify-content:space-between;color:#c9bfd3;font-size:12px;margin-top:-4px}.save{width:100%;border:0;background:#ffab60;color:#24152d;font-weight:800;border-radius:11px;padding:15px}.save:hover{background:#ffc086}.save:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffe2b6;outline-offset:3px}.hint{font-size:13px;color:#c9bfd3;margin:8px 0 0}.preview{min-width:0;position:sticky;top:18px}.preview h2{font-size:17px;color:#d3c7dc;margin:0 0 12px}.canvas-shell{padding:14px;background:#211832;border:1px solid #453651;border-radius:18px;display:flex;justify-content:center}canvas{display:block;width:100%;height:auto;max-width:650px;box-shadow:0 14px 35px #0008}.photo-options[hidden]{display:none}.ratio-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ratio-options label{display:block}.ratio-options input{position:absolute;opacity:0;width:1px;height:1px}.ratio-options span{display:block;text-align:center;border:1px solid #786484;background:#130f20;padding:9px 4px;border-radius:9px;cursor:pointer;font-size:14px}.ratio-options input:checked+span{background:#ffab60;color:#24152d;border-color:#ffab60;font-weight:800}.ratio-options input:focus-visible+span{outline:3px solid #ffe2b6;outline-offset:3px}@media(max-width:830px){.workspace{grid-template-columns:1fr}.preview{position:static;grid-row:1}.editor{grid-template-columns:1fr 1fr}.editor .save-block{grid-column:1/-1}}@media(max-width:600px){main{padding:18px 13px 42px}.workspace{gap:14px}.editor{grid-template-columns:1fr;gap:12px}.editor .save-block{grid-column:auto}.panel{padding:18px}.canvas-shell{padding:8px}}
  </style>
</head>
<body><main>
  <header><h1>핼러윈 파티 입장권</h1><p>배경과 티켓을 꾸민 뒤 한 장의 이미지로 저장해 주세요.</p></header>
  <div class="workspace">
    <div class="editor">
      <section class="panel" aria-labelledby="background-title">
        <h2 id="background-title"><span class="number">1</span> 배경 꾸미기</h2>
        <div class="field"><span>배경 비율</span><div class="ratio-options" role="radiogroup" aria-label="배경 비율">
          <label><input type="radio" name="ratio" value="1:1" checked><span>1:1 정사각형</span></label>
          <label><input type="radio" name="ratio" value="2:3"><span>2:3 세로</span></label>
          <label><input type="radio" name="ratio" value="4:3"><span>4:3 가로</span></label>
        </div></div>
        <label class="field">배경 색상<small>사진을 넣지 않으면 이 색상이 배경이 됩니다.</small><input id="backgroundColor" type="color" value="#221633"></label>
        <label class="field">배경 사진<small>기기에서 사진을 선택하세요. 선택한 사진은 이 기기에서만 처리됩니다.</small><input id="backgroundPhoto" type="file" accept="image/*"></label>
        <div id="photoOptions" class="photo-options" hidden>
          <button id="removeBackground" type="button" style="border:1px solid #786484;background:#130f20;color:#f8f2ec;border-radius:9px;padding:8px 12px;margin:0 0 15px">배경 사진 제거</button>
          <label class="field">사진 확대 <output id="zoomValue">100%</output><input class="slider" id="backgroundZoom" type="range" min="100" max="250" value="100"></label>
          <label class="field">사진 가로 위치<input class="slider" id="backgroundX" type="range" min="0" max="100" value="50"><span class="slider-row"><span>왼쪽</span><span>오른쪽</span></span></label>
          <label class="field">사진 세로 위치<input class="slider" id="backgroundY" type="range" min="0" max="100" value="50"><span class="slider-row"><span>위</span><span>아래</span></span></label>
        </div>
      </section>
      <section class="panel" aria-labelledby="ticket-title">
        <h2 id="ticket-title"><span class="number">2</span> 티켓 꾸미기</h2>
        <label class="field">Name<small>티켓에 표시할 이름을 입력해 주세요.</small><input id="name" type="text" maxlength="40" placeholder="이름을 입력해 주세요" autocomplete="name"></label>
        <label class="field">프로필 사진<small>티켓의 사진 칸에 표시됩니다.</small><input id="ticketPhoto" type="file" accept="image/*"></label>
        <label class="field">티켓 배경 사진<small>티켓 안쪽을 채울 사진을 선택해 주세요.</small><input id="ticketBackgroundPhoto" type="file" accept="image/*"></label>
        <div id="ticketBackgroundOptions" hidden>
          <button id="removeTicketBackground" type="button" style="border:1px solid #786484;background:#130f20;color:#f8f2ec;border-radius:9px;padding:8px 12px;margin-bottom:15px">티켓 배경 사진 제거</button>
          <label class="field">티켓 사진 확대<input class="slider" id="ticketBackgroundZoom" type="range" min="100" max="250" value="100"></label>
          <label class="field">티켓 사진 가로 위치<input class="slider" id="ticketBackgroundX" type="range" min="0" max="100" value="50"></label>
          <label class="field">티켓 사진 세로 위치<input class="slider" id="ticketBackgroundY" type="range" min="0" max="100" value="50"></label>
        </div>
        <label class="field">티켓 투명도 <output id="opacityValue">100%</output><small>낮출수록 티켓 전체가 투명해집니다.</small><input class="slider" id="ticketOpacity" type="range" min="0" max="100" value="100"></label>
        <div class="colors">
          <label class="field">티켓 색상<input id="paper" type="color" value="#321a45"></label>
          <label class="field">글씨 색상<input id="ink" type="color" value="#fff5e8"></label>
          <label class="field">포인트 색상<input id="accent" type="color" value="#ffae62"></label>
        </div>
        <label class="field">티켓 크기 <output id="sizeValue">100%</output><input class="slider" id="ticketSize" type="range" min="60" max="110" value="100"></label>
        <label class="field">티켓 높이<input class="slider" id="ticketY" type="range" min="15" max="85" value="50"><span class="slider-row"><span>위</span><span>아래</span></span></label>
      </section>
      <div class="save-block"><button class="save" id="save" type="button">배경과 티켓을 이미지로 저장하기</button><p class="hint">화면에 보이는 구성이 PNG로 저장됩니다. 사진과 이름은 서버에 업로드되지 않습니다.</p></div>
    </div>
    <section class="preview" aria-labelledby="preview-title"><h2 id="preview-title">미리보기</h2><div class="canvas-shell"><canvas id="previewCanvas" width="1200" height="1200" role="img" aria-label="꾸미고 있는 핼러윈 파티 입장권 미리보기"></canvas></div></section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const canvas=$('previewCanvas'),ctx=canvas.getContext('2d');
let backgroundImage=null,ticketImage=null,ticketBackgroundImage=null;
function loadImage(input,done){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('이미지 파일을 선택해 주세요.');input.value='';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{done(img);URL.revokeObjectURL(url);draw()};img.onerror=()=>{URL.revokeObjectURL(url);alert('사진을 불러오지 못했습니다. 다른 파일을 선택해 주세요.')};img.src=url}
$('backgroundPhoto').addEventListener('change',e=>loadImage(e.target,img=>{backgroundImage=img;$('photoOptions').hidden=false}));
$('ticketPhoto').addEventListener('change',e=>loadImage(e.target,img=>{ticketImage=img}));
$('ticketBackgroundPhoto').addEventListener('change',e=>loadImage(e.target,img=>{ticketBackgroundImage=img;$('ticketBackgroundOptions').hidden=false}));
$('removeTicketBackground').addEventListener('click',()=>{ticketBackgroundImage=null;$('ticketBackgroundPhoto').value='';$('ticketBackgroundOptions').hidden=true;draw()});
$('removeBackground').addEventListener('click',()=>{backgroundImage=null;$('backgroundPhoto').value='';$('photoOptions').hidden=true;draw()});
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',draw));
function rounded(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function cover(c,img,x,y,w,h,zoom=1,px=.5,py=.5){const scale=Math.max(w/img.naturalWidth,h/img.naturalHeight)*zoom;const sw=img.naturalWidth*scale,sh=img.naturalHeight*scale;c.drawImage(img,x-(sw-w)*px,y-(sh-h)*py,sw,sh)}
function drawTicket(){const t=document.createElement('canvas');t.width=1480;t.height=710;const c=t.getContext('2d'),paper=$('paper').value,ink=$('ink').value,accent=$('accent').value;
 c.fillStyle=paper;rounded(c,3,3,1474,704,30);c.fill();if(ticketBackgroundImage){c.save();rounded(c,3,3,1474,704,30);c.clip();cover(c,ticketBackgroundImage,3,3,1474,704,Number($('ticketBackgroundZoom').value)/100,Number($('ticketBackgroundX').value)/100,Number($('ticketBackgroundY').value)/100);c.restore()}c.strokeStyle=accent;c.lineWidth=4;c.stroke();c.globalAlpha=.65;rounded(c,20,20,1440,670,17);c.lineWidth=2;c.stroke();c.globalAlpha=1;
 c.fillStyle=accent;c.font='bold 24px Arial, sans-serif';c.letterSpacing='5px';c.fillText('YOU ARE INVITED',64,94);
 c.fillStyle=ink;c.font='bold 83px Georgia, serif';c.letterSpacing='2px';c.fillText('HALLOWEEN',60,205);c.fillText('PARTY',60,297);
 c.fillStyle=accent;c.font='bold 23px Arial, sans-serif';c.letterSpacing='4px';c.fillText('ADMISSION TICKET · 입장권',64,345);c.letterSpacing='0px';c.globalAlpha=.7;c.fillRect(64,386,1050,2);c.globalAlpha=1;
 c.strokeStyle=accent;c.lineWidth=2;c.strokeRect(64,420,222,264);
 if(ticketImage){c.save();c.beginPath();c.rect(65,421,220,262);c.clip();cover(c,ticketImage,65,421,220,262);c.restore()}else{c.fillStyle=ink;c.globalAlpha=.65;c.font='24px Arial, sans-serif';c.textAlign='center';c.fillText('YOUR PHOTO',175,560);c.textAlign='left';c.globalAlpha=1}
 c.fillStyle=accent;c.font='bold 23px Arial, sans-serif';c.letterSpacing='5px';c.fillText('NAME',330,550);c.fillStyle=ink;c.letterSpacing='0px';const name=$('name').value.trim();if(name){let size=54;do{c.font='bold '+size+'px Georgia, "Noto Sans KR", "Noto Sans JP", "Noto Sans TC", sans-serif';if(c.measureText(name).width<=780)break;size-=2}while(size>22);c.fillText(name,330,615,780)}c.fillStyle=accent;c.fillRect(330,653,780,2);
 c.setLineDash([12,10]);c.beginPath();c.moveTo(1150,20);c.lineTo(1150,690);c.stroke();c.setLineDash([]);c.fillStyle=ink;c.save();c.translate(1210,52);c.rotate(Math.PI/2);c.font='bold 28px Georgia, serif';c.letterSpacing='7px';c.fillText('HALLOWEEN PARTY',0,0);c.restore();c.strokeStyle=accent;c.beginPath();c.arc(1315,507,75,0,Math.PI*2);c.stroke();c.fillStyle=accent;c.textAlign='center';c.font='bold 25px Georgia, serif';c.letterSpacing='1px';c.fillText('ADMIT',1315,503);c.fillText('ONE',1315,535);c.font='22px Arial, sans-serif';c.fillText('★ 001 ★',1315,654);c.textAlign='left';return t}
function draw(){const ratio=document.querySelector('input[name="ratio"]:checked').value,heights={'1:1':1200,'2:3':1800,'4:3':900};const w=1200,h=heights[ratio];if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}ctx.fillStyle=$('backgroundColor').value;ctx.fillRect(0,0,w,h);
 if(backgroundImage){const zoom=Number($('backgroundZoom').value)/100,x=Number($('backgroundX').value)/100,y=Number($('backgroundY').value)/100;cover(ctx,backgroundImage,0,0,w,h,zoom,x,y)}
 const ticket=drawTicket(),size=Number($('ticketSize').value)/100,tw=1080*size,th=tw*710/1480,cy=h*(Number($('ticketY').value)/100),ty=Math.max(25,Math.min(h-th-25,cy-th/2));ctx.shadowColor='#0009';ctx.shadowBlur=35;ctx.shadowOffsetY=18;ctx.globalAlpha=Number($('ticketOpacity').value)/100;ctx.drawImage(ticket,(w-tw)/2,ty,tw,th);ctx.globalAlpha=1;ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 $('opacityValue').textContent=$('ticketOpacity').value+'%';$('zoomValue').textContent=$('backgroundZoom').value+'%';$('sizeValue').textContent=$('ticketSize').value+'%';canvas.setAttribute('aria-label','핼러윈 파티 입장권 미리보기, 배경 비율 '+ratio)}
function loadNameFonts(){const text=$('name').value.trim()||'초대 招待 Guest';return Promise.all(['Noto Sans KR','Noto Sans JP','Noto Sans TC'].map(font=>document.fonts.load('700 54px "'+font+'"',text))).catch(()=>{})}
$('name').addEventListener('input',()=>{loadNameFonts().then(draw)});
$('save').addEventListener('click',async()=>{await loadNameFonts();draw();canvas.toBlob(blob=>{if(!blob){alert('이미지를 저장하지 못했습니다.');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='halloween-party-ticket.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)},'image/png')});
loadNameFonts().then(draw);draw();
</script></body></html>
